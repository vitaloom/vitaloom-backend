server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: vitaloom-backend
  config:
    import: optional:file:.env[.properties]
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  mongodb:
    host: ${MONGO_HOST:localhost}
    port: ${MONGO_PORT:27017}
    database: ${APP_DB:vitaloom_db}
    username: ${APP_USER:vitaloom_app}
    password: ${APP_PASSWORD:change-me-local-app-password}
  data:
    mongodb:
      auto-index-creation: true

vitaloom:
  auth:
    issuer: ${JWT_ISSUER:https://api.vitaloom.local}
    access-secret: ${JWT_ACCESS_SECRET}
    refresh-secret: ${JWT_REFRESH_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081}
  mongodb:
    server-selection-timeout-ms: ${MONGO_SERVER_SELECTION_TIMEOUT_MS:2000}
    transactions:
      enabled: ${MONGO_TRANSACTIONS_ENABLED:false}
