receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

  prometheus/cadvisor:
    config:
      scrape_configs:
        - job_name: cadvisor
          scrape_interval: 15s
          static_configs:
            - targets: [cadvisor:8080]
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: 'container_(cpu_usage_seconds_total|memory_working_set_bytes|network_(receive|transmit)_bytes_total)'
              action: keep
            - source_labels: [name, container_label_com_docker_compose_project]
              regex: '.+;(vitaloom-backend|vitaloom-observability)'
              action: keep
            - source_labels: [name]
              target_label: container_name


exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    metric_expiration: 45s

service:
  pipelines:
    metrics:
      receivers: [otlp]
      exporters: [prometheus]
    metrics/cadvisor:
      receivers: [prometheus/cadvisor]
      exporters: [prometheus]
