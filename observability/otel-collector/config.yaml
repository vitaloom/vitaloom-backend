receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

  prometheus/cadvisor:
    config:
      scrape_configs:
        - job_name: cadvisor
          scrape_interval: 15s
          static_configs:
            - targets: [cadvisor:8080]
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: 'container_(cpu_usage_seconds_total|memory_working_set_bytes|network_(receive|transmit)_bytes_total)'
              action: keep
            - source_labels: [name, container_label_com_docker_compose_project]
              regex: '.+;(vitaloom-backend|vitaloom-observability)'
              action: keep
            - source_labels: [name]
              target_label: container_name

  prometheus/windows:
    config:
      scrape_configs:
        - job_name: windows-host
          scrape_interval: 15s
          static_configs:
            - targets: [host.docker.internal:9182]
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: 'windows_(cpu_time_seconds_total|memory_available_bytes|logical_disk_(free|size)_bytes|physical_disk_(read_latency_seconds_total|write_latency_seconds_total|reads_total|writes_total)|net_bytes_(received|sent)_total)'
              action: keep

  nginx:
    endpoint: http://nginx:8080/stub_status
    collection_interval: 15s

  mongodb:
    hosts:
      - endpoint: mongodb:27017
    username: ${env:OBS_MONGODB_USER}
    password: ${env:OBS_MONGODB_PASSWORD}
    auth_source: admin
    direct_connection: true
    collection_interval: 30s
    timeout: 5s
    tls:
      insecure: true

  filelog/nginx_rate_limit:
    include:
      - /var/log/vitaloom/rate-limit.log
      - '/var/log/vitaloom/rate-limit.log.[12]'
    start_at: end
    storage: file_storage
    include_file_name: false
    operators:
      - type: regex_parser
        regex: '^(?P<rejected>[01]) (?P<status>[0-9]{3})? ?[0-9]+\.[0-9]+ [0-9]+$'

extensions:
  file_storage:
    directory: /var/lib/vitaloom-collector

connectors:
  signal_to_metrics:
    logs:
      - name: nginx.rate_limit.rejected
        description: Client requests rejected by the Nginx rate limiter
        sum:
          value: Int(attributes["rejected"])
          monotonic: true
      - name: nginx.gateway.errors.499
        description: Nginx client-closed requests
        sum:
          value: Int(attributes["gateway_error_499"])
          monotonic: true
      - name: nginx.gateway.errors.502
        description: Nginx bad-gateway responses
        sum:
          value: Int(attributes["gateway_error_502"])
          monotonic: true
      - name: nginx.gateway.errors.504
        description: Nginx gateway-timeout responses
        sum:
          value: Int(attributes["gateway_error_504"])
          monotonic: true

processors:
  transform/nginx_gateway_errors:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(attributes["gateway_error_499"], "0")
          - set(attributes["gateway_error_499"], "1") where attributes["status"] == "499"
          - set(attributes["gateway_error_502"], "0")
          - set(attributes["gateway_error_502"], "1") where attributes["status"] == "502"
          - set(attributes["gateway_error_504"], "0")
          - set(attributes["gateway_error_504"], "1") where attributes["status"] == "504"
  deltatocumulative:
  filter/mongodb:
    error_mode: ignore
    metrics:
      metric:
        - 'name != "mongodb.connection.count" and name != "mongodb.operation.count"'

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    metric_expiration: 45s

service:
  extensions: [file_storage]
  pipelines:
    metrics:
      receivers: [otlp]
      exporters: [prometheus]
    metrics/cadvisor:
      receivers: [prometheus/cadvisor]
      exporters: [prometheus]
    metrics/windows:
      receivers: [prometheus/windows]
      exporters: [prometheus]
    metrics/nginx:
      receivers: [nginx]
      exporters: [prometheus]
    metrics/mongodb:
      receivers: [mongodb]
      processors: [filter/mongodb]
      exporters: [prometheus]
    logs/nginx_rate_limit:
      receivers: [filelog/nginx_rate_limit]
      processors: [transform/nginx_gateway_errors]
      exporters: [signal_to_metrics]
    metrics/nginx_rate_limit:
      receivers: [signal_to_metrics]
      processors: [deltatocumulative]
      exporters: [prometheus]
