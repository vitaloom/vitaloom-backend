services:
  mongodb:
    image: mongo:8.0.29-noble
    container_name: vitaloom_mongodb_srv
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/opt/vitaloom-mongo/start.sh"]
    command:
      - mongod
      - --replSet
      - ${MONGO_REPLICA_SET:-vitaloom-rs}
      - --bind_ip_all
      - --keyFile
      - /data/configdb/vitaloom-keyfile
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:?Set MONGO_PASS in .env}
      APP_DB: ${APP_DB:-vitaloom_db}
      APP_USER: ${APP_USER:-vitaloom_app}
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env}
      MONGO_REPLICA_SET: ${MONGO_REPLICA_SET:-vitaloom-rs}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./docker/mongo:/opt/vitaloom-mongo:ro
      - ./docker/mongo/init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --host
        - 127.0.0.1
        - --port
        - "27017"
        - --file
        - /opt/vitaloom-mongo/ready.js
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - vitaloom-network

  mongo-express:
    image: mongo-express:1.0.2-18-alpine3.19
    container_name: vitaloom_mongo_express_ui
    restart: unless-stopped
    ports:
      - "${ME_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-root}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASS:?Set MONGO_PASS in .env}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-root}:${MONGO_PASS:?Set MONGO_PASS in .env}@mongodb:27017/?authSource=admin&directConnection=true
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_BASIC_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_BASIC_PASS:?Set ME_BASIC_PASS in .env}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - vitaloom-network

volumes:
  mongodb_data:
    name: vitaloom_mongodb_data
  mongodb_config:
    name: vitaloom_mongodb_config

networks:
  vitaloom-network:
    name: vitaloom-network
    driver: bridge
