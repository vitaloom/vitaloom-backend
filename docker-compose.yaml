services:
  mongodb:
    image: mongo:8.0.29-noble
    container_name: vitaloom_mongodb_srv
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/opt/vitaloom-mongo/start.sh"]
    command: ["mongod", "--replSet", "vitaloom-rs", "--bind_ip_all", "--keyFile", "/data/configdb/vitaloom-keyfile"]
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-change-me-local-root-password}
      APP_DB: ${APP_DB:-vitaloom_db}
      APP_USER: ${APP_USER:-vitaloom_app}
      APP_PASSWORD: ${APP_PASSWORD:-change-me-local-app-password}
    volumes:
      - vitaloom_mongodb_data:/data/db
      - vitaloom_mongodb_config:/data/configdb
      - ./tools/mongo:/opt/vitaloom-mongo:ro
      - ./init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--host", "127.0.0.1", "--port", "27017", "--file", "/opt/vitaloom-mongo/ready.js"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - vitaloom-network

  mongo-express:
    image: mongo-express:1.0.2-18-alpine3.19
    container_name: vitaloom_mongo_express_ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ME_PORT:-8082}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-root}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASS:-change-me-local-root-password}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-root}:${MONGO_PASS:-change-me-local-root-password}@mongodb:27017/?authSource=admin&directConnection=true
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_BASIC_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_BASIC_PASS:-change-me-local-admin-password}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - vitaloom-network
  nginx:
    image: nginx:1.31.4-alpine
    container_name: vitaloom_nginx_gateway
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      NGINX_ENVSUBST_FILTER: '^SERVER_PORT$$'
    volumes:
      - ./nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
    networks:
      - vitaloom-network

volumes:
  vitaloom_mongodb_data:
    name: vitaloom_mongodb_data
  vitaloom_mongodb_config:
    name: vitaloom_mongodb_config

networks:
  vitaloom-network:
    name: vitaloom-network
    driver: bridge
