    location = /api/auth/login {
        limit_req zone=auth_login burst=3 nodelay;
        limit_req_status 429;
        error_page 429 = @auth_login_rate_limited;
        proxy_pass http://vitaloom_backend;
    }

    location @auth_login_rate_limited {
        default_type application/json;
        add_header Access-Control-Allow-Origin $rate_limit_origin always;
        add_header Access-Control-Expose-Headers Retry-After always;
        add_header Vary Origin always;
        add_header Retry-After 12 always;
        return 429 '{"code":"LOGIN_RATE_LIMITED"}';
    }

    location = /api/auth/register {
        limit_req zone=auth_register burst=2 nodelay;
        limit_req_status 429;
        error_page 429 = @auth_register_rate_limited;
        proxy_pass http://vitaloom_backend;
    }

    location @auth_register_rate_limited {
        default_type application/json;
        add_header Access-Control-Allow-Origin $rate_limit_origin always;
        add_header Access-Control-Expose-Headers Retry-After always;
        add_header Vary Origin always;
        add_header Retry-After 20 always;
        return 429 '{"code":"REGISTER_RATE_LIMITED"}';
    }

    location = /api/auth/refresh {
        limit_req zone=auth_refresh burst=3 nodelay;
        limit_req_status 429;
        error_page 429 = @auth_refresh_rate_limited;
        proxy_pass http://vitaloom_backend;
    }

    location @auth_refresh_rate_limited {
        default_type application/json;
        add_header Access-Control-Allow-Origin $rate_limit_origin always;
        add_header Access-Control-Expose-Headers Retry-After always;
        add_header Vary Origin always;
        add_header Retry-After 6 always;
        return 429 '{"code":"REFRESH_RATE_LIMITED"}';
    }

    location /api/statistics/ {
        limit_req zone=statistics burst=6 nodelay;
        limit_req_status 429;
        error_page 429 = @statistics_rate_limited;
        proxy_pass http://vitaloom_backend;
    }

    location @statistics_rate_limited {
        default_type application/json;
        add_header Access-Control-Allow-Origin $rate_limit_origin always;
        add_header Access-Control-Expose-Headers Retry-After always;
        add_header Vary Origin always;
        add_header Retry-After 2 always;
        return 429 '{"code":"STATISTICS_RATE_LIMITED"}';
    }

    location = /api/heart-rate/batch {
        limit_req zone=ingestion_heart_rate burst=5 nodelay;
        limit_req_status 429;
        limit_req_dry_run ${INGESTION_LIMIT_DRY_RUN};
        proxy_pass http://vitaloom_backend;
    }

    location = /api/steps/batch {
        limit_req zone=ingestion_steps burst=5 nodelay;
        limit_req_status 429;
        limit_req_dry_run ${INGESTION_LIMIT_DRY_RUN};
        proxy_pass http://vitaloom_backend;
    }
