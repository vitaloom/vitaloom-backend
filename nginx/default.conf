include /etc/nginx/vitaloom/rate-limit-zones.conf;

map $limit_req_status $rate_limit_rejected {
    default 0;
    REJECTED 1;
}

map "$rate_limit_rejected:$status" $gateway_telemetry_loggable {
    default 0;
    ~^1: 1;
    ~:(499|502|504)$ 1;
}

log_format vitaloom_rate_limit '$rate_limit_rejected $status $msec $connection';

upstream vitaloom_backend {
    server host.docker.internal:${SERVER_PORT};
}
server {
    listen 80;
    server_name _;

    access_log /dev/stdout combined;
    access_log /var/log/vitaloom/rate-limit.log vitaloom_rate_limit if=$gateway_telemetry_loggable;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    include /etc/nginx/conf.d/rate-limit-routes.inc;

    location / {
        proxy_pass http://vitaloom_backend;
    }
}

server {
    listen 8080;
    server_name _;
    access_log off;

    location = /stub_status {
        stub_status;
        access_log /var/log/vitaloom/rate-limit.log vitaloom_rate_limit;
    }

    location / {
        return 404;
    }
}
