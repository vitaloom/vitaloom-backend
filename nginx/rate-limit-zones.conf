map $request_method $rate_limit_key {
    OPTIONS "";
    default $binary_remote_addr;
}
limit_req_zone $rate_limit_key zone=auth_login:1m rate=5r/m;
limit_req_zone $rate_limit_key zone=auth_register:1m rate=3r/m;
limit_req_zone $rate_limit_key zone=auth_refresh:1m rate=10r/m;
limit_req_zone $rate_limit_key zone=statistics:1m rate=30r/m;

map $http_origin $rate_limit_origin {
    default "";
    "http://localhost:8081" $http_origin;
    "http://127.0.0.1:8081" $http_origin;
}

limit_req_zone $rate_limit_key zone=ingestion_heart_rate:1m rate=30r/m;
limit_req_zone $rate_limit_key zone=ingestion_steps:1m rate=30r/m;
